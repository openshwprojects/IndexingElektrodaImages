<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elektroda AI Image Tag Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .filters { margin-bottom: 10px; }
    .filters input[type="text"] { width: 300px; }
    .filters label { margin-right: 10px; }
    .image-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .thumb {
      border: 1px solid #ccc;
      padding: 5px;
      cursor: pointer;
      width: 360px;
    }
    .thumb-img-wrapper {
      position: relative;
    }
    .thumb img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .thumb.expanded { width: 100%; }
    .thumb.expanded img { max-width: 1200px; }
    .overlay-bottom {
      position: absolute;
      bottom: 5px;
      left: 5px;
      right: 5px;
      background-color: rgba(0,0,0,0.5);
      color: white;
      padding: 3px 6px;
      font-size: 0.75em;
      font-weight: bold;
      border-radius: 4px;
      line-height: 1.4em;
      word-wrap: break-word;
    }
    .overlay-bottom .match { color: #00ff00; }
    .overlay-bottom .nomatch { color: #ff5555; }
    .tags { font-size: 0.9em; margin-top: 5px; padding-left: 15px; }
    .hidden { display: none; }
    #generalStats, #searchStats { margin: 10px 0; font-size: 0.9em; color: #333; }
    #generalStats { font-weight: bold; white-space: pre-line; }
    fieldset { border: 1px solid #ccc; padding: 10px; margin: 8px 0; border-radius: 4px; }
    fieldset legend { font-weight: bold; font-size: 0.9em; }
    .prompt-tab { display: inline-block; padding: 4px 12px; margin: 2px; border: 1px solid #999; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
    .prompt-tab.active { background: #4a90d9; color: white; border-color: #4a90d9; }
    .prompt-tab .count { font-size: 0.8em; color: #888; margin-left: 4px; }
    .prompt-tab.active .count { color: #dde; }
  </style>
</head>
<body>
  <h1>Elektroda AI Image Tag Search</h1>
  <div id="generalStats">Loading stats...</div>

  <form class="filters" id="searchForm">
    <fieldset>
      <legend>Prompt Type</legend>
      <div id="promptTabs"></div>
    </fieldset>

    <label>Must have tags: <input type="text" id="mustHave" placeholder="e.g. camera security outdoor"></label>
    <label>Must not have tags: <input type="text" id="mustNotHave" placeholder="e.g. microphone speaker"></label>
    <br><br>
    <label><input type="checkbox" id="wholeWords" checked> Match only whole words</label>
    <br><br>
    <label>Show results:
      <select id="resultCount">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="250">250</option>
      </select>
    </label>
    <br><br>
    <div id="models"></div>
    <br>
    <button type="submit">Search</button>
    <div id="searchStats"></div>
  </form>

  <div class="image-grid" id="results"></div>

  <script>
    let data = [];
    let allModels = new Set();
    let modelUsageCount = {};
    let activePromptType = 'tags';
    let promptTypes = {}; // { codeName: { count, models: Set } }

    // === Compatibility layer: extract taggroups for a given prompt type ===
    function getTaggroups(img, promptType) {
      if (!img.prompts) return img.taggroups || {};
      const prompt = img.prompts.find(p => p.codeName === promptType);
      return prompt ? prompt.taggroups : {};
    }

    function getIndexableImages(promptType) {
      return data.filter(img => {
        const tg = getTaggroups(img, promptType);
        return tg && Object.keys(tg).length > 0;
      });
    }

    fetch('work.json')
      .then(res => res.json())
      .then(json => {
        data = json.images || [];

        // Discover all prompt types and models
        for (const img of data) {
          if (img.prompts) {
            for (const prompt of img.prompts) {
              if (!promptTypes[prompt.codeName]) {
                promptTypes[prompt.codeName] = { count: 0, models: new Set() };
              }
              promptTypes[prompt.codeName].count++;
              for (const model in prompt.taggroups) {
                promptTypes[prompt.codeName].models.add(model);
              }
            }
          } else if (img.taggroups) {
            // Legacy format
            if (!promptTypes['tags']) promptTypes['tags'] = { count: 0, models: new Set() };
            promptTypes['tags'].count++;
            for (const model in img.taggroups) {
              promptTypes['tags'].models.add(model);
            }
          }
        }

        // Default to first available prompt type
        activePromptType = Object.keys(promptTypes)[0] || 'tags';
        renderPromptTabs();
        rebuildModels();
        updateGeneralStats();
        applyFilters();
      });

    function renderPromptTabs() {
      const container = document.getElementById('promptTabs');
      container.innerHTML = '';
      for (const [codeName, info] of Object.entries(promptTypes)) {
        const tab = document.createElement('span');
        tab.className = 'prompt-tab' + (codeName === activePromptType ? ' active' : '');
        tab.innerHTML = `${codeName} <span class="count">(${info.count})</span>`;
        tab.onclick = () => {
          activePromptType = codeName;
          renderPromptTabs();
          rebuildModels();
          updateGeneralStats();
          applyFilters();
        };
        container.appendChild(tab);
      }
    }

    function rebuildModels() {
      allModels = promptTypes[activePromptType]?.models || new Set();
      modelUsageCount = {};
      const indexable = getIndexableImages(activePromptType);
      for (const img of indexable) {
        const tg = getTaggroups(img, activePromptType);
        for (const model in tg) {
          modelUsageCount[model] = (modelUsageCount[model] || 0) + 1;
        }
      }
      renderModelCheckboxes();
    }

    function renderModelCheckboxes() {
      const container = document.getElementById('models');
      container.innerHTML = '';
      Array.from(allModels).sort().forEach(model => {
        const id = `model_${model.replace(/[:.]/g, "_")}`;
        const match = model.match(/:(\d+\.?\d*)b/i);
        const size = match ? parseFloat(match[1]) : 0;
        const checkedStr = size <= 4 ? 'checked' : '';
        container.innerHTML += `<label><input type="checkbox" id="${id}" ${checkedStr}> ${model} (${modelUsageCount[model] || 0})</label> `;
      });
    }

    function updateGeneralStats() {
      const totalImages = data.length;
      const indexable = getIndexableImages(activePromptType);
      const totalTagGroups = indexable.reduce((sum, img) => Object.keys(getTaggroups(img, activePromptType)).length + sum, 0);
      const lines = [];
      lines.push(`${totalImages} images total, ${indexable.length} indexable for "${activePromptType}" prompt`);
      lines.push(`${totalTagGroups} tag groups, ${Object.keys(promptTypes).length} prompt type(s): ${Object.keys(promptTypes).join(', ')}`);
      const modelLines = Object.entries(modelUsageCount)
        .sort((a, b) => b[1] - a[1])
        .map(([model, count]) => `  ${model}: ${count}`);
      lines.push(...modelLines);
      document.getElementById('generalStats').innerText = lines.join('\n');
    }

    function getCheckedModels() {
      return Array.from(allModels).filter(model => {
        const id = `model_${model.replace(/[:.]/g, "_")}`;
        return document.getElementById(id)?.checked;
      });
    }

    function matchesTag(allTags, tag, wholeWords) {
      if (wholeWords) {
        const regex = new RegExp(`\\b${tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
        return regex.test(allTags);
      }
      return allTags.includes(tag);
    }

    function applyFilters() {
      const must = document.getElementById('mustHave').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const mustNot = document.getElementById('mustNotHave').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const limit = parseInt(document.getElementById('resultCount').value);
      const models = getCheckedModels();
      const wholeWords = document.getElementById('wholeWords').checked;
      const indexable = getIndexableImages(activePromptType);

      const resultContainer = document.getElementById('results');
      resultContainer.innerHTML = '';

      let matching = [];

      for (const img of indexable) {
        const tg = getTaggroups(img, activePromptType);
        let allTags = models.map(model => tg[model] || '').join('; ').toLowerCase();
        if (must.length && !must.every(tag => matchesTag(allTags, tag, wholeWords))) continue;
        if (mustNot.some(tag => matchesTag(allTags, tag, wholeWords))) continue;
        matching.push(img);
      }

      const shown = matching.slice(0, limit);
      document.getElementById('searchStats').textContent = `Showing ${shown.length} of ${matching.length} matching images (prompt: ${activePromptType})`;

      for (const img of shown) {
        const div = document.createElement('div');
        div.className = 'thumb';
        const overlay = document.createElement('div');
        overlay.className = 'overlay-bottom';
        const overlaySpans = [];
        const tg = getTaggroups(img, activePromptType);

        for (const model of models) {
          const span = document.createElement('span');
          span.textContent = model;
          const groupTags = (tg[model] || '').toLowerCase();
          let isMatch = true;
          if (must.length && !must.every(tag => matchesTag(groupTags, tag, wholeWords))) isMatch = false;
          if (mustNot.some(tag => matchesTag(groupTags, tag, wholeWords))) isMatch = false;
          span.className = isMatch ? 'match' : 'nomatch';
          overlaySpans.push(span.outerHTML);
        }

        overlay.innerHTML = overlaySpans.join(', ');
        div.innerHTML = `<div class="thumb-img-wrapper"><img src="${img.url}"></div><div class="tags hidden"></div>`;
        div.querySelector('.thumb-img-wrapper').appendChild(overlay);
        div.onclick = () => toggleExpand(div, img);
        resultContainer.appendChild(div);
      }
    }

    function toggleExpand(div, img) {
      const isExpanded = div.classList.toggle('expanded');
      const tagDiv = div.querySelector('.tags');
      if (isExpanded) {
        const models = getCheckedModels();
        let content = '';
        const tg = getTaggroups(img, activePromptType);
        for (const model of Object.keys(tg).sort()) {
          if (models.length === 0 || models.includes(model)) {
            content += `<strong>${model}:</strong> ${tg[model]}<br>`;
          }
        }
        if (content) {
          tagDiv.innerHTML = content;
          tagDiv.classList.remove('hidden');
        }
        const rect = div.getBoundingClientRect();
        const top = rect.top + window.scrollY - (window.innerHeight / 2) + (rect.height / 2);
        window.scrollTo({ top, behavior: 'smooth' });
      } else {
        tagDiv.classList.add('hidden');
      }
    }

    document.getElementById('searchForm').addEventListener('submit', function (e) {
      e.preventDefault();
      applyFilters();
    });
  </script>
</body>
</html>
