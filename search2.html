<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elektroda AI Image Tag Search v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: #e0e0e8;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 28px 32px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7f5af0, #2cb5e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .header .subtitle {
      font-size: 0.82rem;
      color: #8888a4;
    }

    /* ── Search Panel ── */
    .search-panel {
      background: rgba(22, 22, 40, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 20px 32px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .search-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9999b5;
    }
    .field input[type="text"] {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px 14px;
      color: #e0e0e8;
      font-size: 0.9rem;
      font-family: inherit;
      width: 280px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input[type="text"]:focus {
      outline: none;
      border-color: #7f5af0;
      box-shadow: 0 0 0 3px rgba(127,90,240,0.15);
    }
    .field input[type="text"]::placeholder { color: #555570; }

    .btn-search {
      background: linear-gradient(135deg, #7f5af0, #6b3fd4);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-search:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(127,90,240,0.35);
    }
    .btn-search:active { transform: translateY(0); }

    .prompt-tabs {
      margin-top: 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .prompt-tab {
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #9999b5;
      transition: all 0.2s;
      user-select: none;
    }
    .prompt-tab:hover { background: rgba(127,90,240,0.12); border-color: rgba(127,90,240,0.3); }
    .prompt-tab.active {
      background: linear-gradient(135deg, #7f5af0, #6b3fd4);
      color: #fff;
      border-color: #7f5af0;
    }
    .prompt-tab .tab-count { font-size: 0.7rem; opacity: 0.7; margin-left: 4px; }
    .models-row {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      align-items: center;
    }
    .models-row .models-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9999b5;
      margin-right: 4px;
    }
    .model-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
    }
    .model-chip:hover { background: rgba(127,90,240,0.12); border-color: rgba(127,90,240,0.3); }
    .model-chip input[type="checkbox"] {
      accent-color: #7f5af0;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    .model-family {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(127,90,240,0.25);
      border-radius: 8px;
      padding: 4px 6px;
      background: rgba(127,90,240,0.05);
    }
    .model-family-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: #7f5af0;
      padding: 0 4px;
      white-space: nowrap;
    }

    .stats-bar {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #7777a0;
    }

    /* ── Results Grid ── */
    .results-container { padding: 24px 32px 60px; }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
      border-color: rgba(127,90,240,0.25);
    }
    .card img {
      width: 100%;
      display: block;
      aspect-ratio: 4/3;
      object-fit: cover;
      transition: filter 0.3s;
    }
    .card:hover img { filter: brightness(1.08); }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      font-size: 0.68rem;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .card-overlay .model-badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }
    .card-overlay .model-badge.match { background: rgba(45,180,90,0.7); color: #d0ffd0; }
    .card-overlay .model-badge.nomatch { background: rgba(200,60,60,0.6); color: #ffc0c0; }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(8px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .lightbox.open { display: flex; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .lb-close {
      position: absolute;
      top: 16px; right: 24px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #ccc;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }
    .lb-close:hover { background: rgba(255,255,255,0.2); color: #fff; }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ccc;
      width: 48px; height: 48px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      z-index: 10;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .lb-nav:active { transform: translateY(-50%) scale(0.92); }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }

    .lb-content {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      width: 90vw;
      height: 85vh;
      gap: 24px;
      justify-content: center;
    }

    .lb-img-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 50%;
      position: relative;
    }
    .lb-img-wrap > a {
      display: block;
      position: relative;
      max-width: 100%;
      max-height: 100%;
    }
    .lb-img-wrap > a img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      display: block;
    }

    .maximize-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .maximize-btn:hover { background: rgba(127,90,240,0.9); }
    .lb-img-wrap:hover .maximize-btn { opacity: 1; }

    .lb-tags {
      flex: 1;
      max-width: 50%;
      height: 100%;
      overflow-y: auto;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .lb-tags::-webkit-scrollbar { width: 6px; }
    .lb-tags::-webkit-scrollbar-track { background: transparent; }
    .lb-tags::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    @media (max-width: 768px) {
      .lb-content {
        flex-direction: column;
        height: auto;
        max-height: 90vh;
      }
      .lb-img-wrap, .lb-tags { max-width: 100%; }
      .lb-img-wrap { max-height: 50vh; }
      .lb-img-wrap > a img { max-height: 50vh; }
      .lb-tags { height: auto; max-height: 40vh; }
    }

    .lb-tag-col {
      font-size: 0.78rem;
      line-height: 1.55;
      border-right: 1px solid rgba(255,255,255,0.06);
      padding-right: 10px;
    }
    .lb-tag-col:last-child { border-right: none; padding-right: 0; }
    .lb-tag-col .model-name {
      font-weight: 700;
      color: #7f5af0;
      display: block;
      margin-bottom: 4px;
      font-size: 0.82rem;
    }
    .lb-tag-col .tag-text { color: #bbbbd0; }
    .tag-freq-all     { color: #1db954; font-weight: 700; }
    .tag-freq-almost  { color: #4cd97b; }
    .tag-freq-neutral { color: #bbbbd0; }
    .tag-freq-low     { color: #e87070; }
    .tag-freq-single  { color: #b33030; }

    .lb-counter {
      position: absolute;
      bottom: 14px;
      right: 24px;
      font-size: 0.75rem;
      color: #666;
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 10px;
      font-size: 0.9rem;
      color: #7777a0;
    }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid rgba(127,90,240,0.2);
      border-top-color: #7f5af0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #555570;
      font-size: 0.95rem;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Elektroda AI Image Tag Search</h1>
    <div class="subtitle" id="generalStats">Loading dataset…</div>
  </div>

  <form class="search-panel" id="searchForm" autocomplete="off">
    <div class="search-row">
      <div class="field">
        <label for="mustHave">Must Have Tags</label>
        <input type="text" id="mustHave" placeholder="e.g. camera security outdoor">
      </div>
      <div class="field">
        <label for="mustNotHave">Must Not Have Tags</label>
        <input type="text" id="mustNotHave" placeholder="e.g. microphone speaker">
      </div>
      <div class="field">
        <label for="resultCount">Max Results</label>
        <select id="resultCount" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:10px 14px; color:#e0e0e8; font-size:0.9rem; font-family:inherit;">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="250">250</option>
          <option value="500">500</option>
        </select>
      </div>
      <button type="submit" class="btn-search">Search</button>
    </div>
    <div class="prompt-tabs" id="promptTabs"></div>
    <div class="models-row" id="modelsRow">
      <span class="models-label">Models:</span>
    </div>
    <div class="stats-bar" id="searchStats"></div>
  </form>

  <div class="results-container">
    <div id="loadingIndicator" class="loading">
      <div class="spinner"></div>
      <span>Loading work.json…</span>
    </div>
    <div class="image-grid" id="results"></div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose" title="Close (Esc)">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" title="Previous (←)">‹</button>
    <button class="lb-nav lb-next" id="lbNext" title="Next (→)">›</button>
    <div class="lb-content">
      <div class="lb-img-wrap">
        <a id="lbImgLink" href="" target="_blank" title="View Full Size">
          <img id="lbImg" src="" alt="">
          <div class="maximize-btn">⛶ Maximize</div>
        </a>
      </div>
      <div class="lb-tags" id="lbTags"></div>
    </div>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

<script>
  // ── State ──
  let data = [];
  let allModels = new Set();
  let sortedModelsList = [];
  let indexableImages = [];
  let modelUsageCount = {};
  let currentResults = [];
  let lightboxIndex = -1;
  let activePromptType = 'tags';
  let promptTypesInfo = {}; // { codeName: { count, models: Set } }

  // ── Compatibility: extract taggroups for a prompt type ──
  function getTaggroups(img, promptType) {
    if (img.prompts) {
      const p = img.prompts.find(x => x.codeName === promptType);
      return p ? p.taggroups : {};
    }
    return img.taggroups || {};
  }

  // Sort models: group by base name, sort within group by param size
  function getModelBaseName(name) {
    const colonIdx = name.indexOf(':');
    return colonIdx >= 0 ? name.substring(0, colonIdx).toLowerCase() : name.toLowerCase();
  }
  function getModelParamSize(name) {
    const match = name.match(/:(\d+\.?\d*)b/i);
    return match ? parseFloat(match[1]) : 0;
  }
  function compareModels(a, b) {
    const baseA = getModelBaseName(a);
    const baseB = getModelBaseName(b);
    // Keep same family together
    if (baseA !== baseB) return baseA.localeCompare(baseB);
    // Within same family sort by param size
    return getModelParamSize(a) - getModelParamSize(b);
  }

  // ── DOM refs ──
  const dom = {
    promptTabs:       document.getElementById('promptTabs'),
    generalStats:     document.getElementById('generalStats'),
    modelsRow:        document.getElementById('modelsRow'),
    searchStats:      document.getElementById('searchStats'),
    results:          document.getElementById('results'),
    loadingIndicator: document.getElementById('loadingIndicator'),
    mustHave:         document.getElementById('mustHave'),
    mustNotHave:      document.getElementById('mustNotHave'),
    resultCount:      document.getElementById('resultCount'),
    searchForm:       document.getElementById('searchForm'),
    lightbox:         document.getElementById('lightbox'),
    lbImgLink:        document.getElementById('lbImgLink'),
    lbImg:            document.getElementById('lbImg'),
    lbTags:           document.getElementById('lbTags'),
    lbCounter:        document.getElementById('lbCounter'),
    lbClose:          document.getElementById('lbClose'),
    lbPrev:           document.getElementById('lbPrev'),
    lbNext:           document.getElementById('lbNext'),
  };

  // ── Load Data ──
  fetch('work.json')
    .then(r => r.json())
    .then(json => {
      data = json.images || [];
      // Discover prompt types
      for (const img of data) {
        if (img.prompts) {
          for (const p of img.prompts) {
            if (!promptTypesInfo[p.codeName]) promptTypesInfo[p.codeName] = { count: 0, models: new Set() };
            promptTypesInfo[p.codeName].count++;
            for (const m in p.taggroups) promptTypesInfo[p.codeName].models.add(m);
          }
        } else if (img.taggroups) {
          if (!promptTypesInfo['tags']) promptTypesInfo['tags'] = { count: 0, models: new Set() };
          promptTypesInfo['tags'].count++;
          for (const m in img.taggroups) promptTypesInfo['tags'].models.add(m);
        }
      }
      activePromptType = Object.keys(promptTypesInfo)[0] || 'tags';
      renderPromptTabs();
      rebuildForPromptType();
      dom.loadingIndicator.style.display = 'none';
      applyFilters();
      handleHashOnLoad();
    })
    .catch(err => {
      dom.loadingIndicator.innerHTML = `<span style="color:#ff5555">Failed to load work.json: ${err.message}</span>`;
    });

  function renderPromptTabs() {
    dom.promptTabs.innerHTML = '';
    for (const [name, info] of Object.entries(promptTypesInfo)) {
      const tab = document.createElement('span');
      tab.className = 'prompt-tab' + (name === activePromptType ? ' active' : '');
      tab.innerHTML = `${name} <span class="tab-count">(${info.count})</span>`;
      tab.onclick = () => { activePromptType = name; renderPromptTabs(); rebuildForPromptType(); applyFilters(); };
      dom.promptTabs.appendChild(tab);
    }
  }

  function rebuildForPromptType() {
    allModels = new Set();
    modelUsageCount = {};
    indexableImages = data.filter(img => {
      const tg = getTaggroups(img, activePromptType);
      return tg && Object.keys(tg).length > 0;
    });
    for (const img of indexableImages) {
      const tg = getTaggroups(img, activePromptType);
      for (const model in tg) {
        allModels.add(model);
        modelUsageCount[model] = (modelUsageCount[model] || 0) + 1;
      }
    }
    sortedModelsList = Array.from(allModels).sort(compareModels);
    renderModelCheckboxes();
    updateGeneralStats();
  }

  // ── Model Checkboxes ──
  function renderModelCheckboxes() {
    const fragment = document.createDocumentFragment();
    const label = document.createElement('span');
    label.className = 'models-label';
    label.textContent = 'Include only images that has tags by models:';
    fragment.appendChild(label);

    // Group models by base name to detect families
    const familyMap = new Map();
    for (const model of sortedModelsList) {
      const base = getModelBaseName(model);
      if (!familyMap.has(base)) familyMap.set(base, []);
      familyMap.get(base).push(model);
    }

    for (const [base, members] of familyMap) {
      if (members.length > 1) {
        // Wrap family in a rectangle
        const familyDiv = document.createElement('div');
        familyDiv.className = 'model-family';
        const familyLabel = document.createElement('span');
        familyLabel.className = 'model-family-label';
        familyLabel.textContent = base;
        familyDiv.appendChild(familyLabel);
        for (const model of members) {
          familyDiv.appendChild(createModelChip(model, true));
        }
        fragment.appendChild(familyDiv);
      } else {
        fragment.appendChild(createModelChip(members[0], false));
      }
    }
    dom.modelsRow.innerHTML = '';
    dom.modelsRow.appendChild(fragment);
  }

  function createModelChip(model, inFamily) {
    const chip = document.createElement('label');
    chip.className = 'model-chip';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.dataset.model = model;
    const size = getModelParamSize(model);
    cb.checked = (size <= 4);
    chip.appendChild(cb);
    // If inside a family, show only the param suffix (e.g. "0.4b")
    const displayName = inFamily ? model.substring(model.indexOf(':') + 1) : model;
    chip.appendChild(document.createTextNode(displayName));
    return chip;
  }

  function updateGeneralStats() {
    const total = data.length;
    const indexable = indexableImages.length;
    const totalTags = indexableImages.reduce((s, img) => s + Object.keys(getTaggroups(img, activePromptType)).length, 0);
    const modelInfo = Object.entries(modelUsageCount)
      .sort((a, b) => b[1] - a[1])
      .map(([m, c]) => `${m}: ${c}`)
      .join(' · ');
    dom.generalStats.textContent = `${total} images (${indexable} indexed) · ${totalTags} tag groups · ${modelInfo}`;
  }

  function getCheckedModels() {
    return Array.from(dom.modelsRow.querySelectorAll('input[type="checkbox"]'))
      .filter(cb => cb.checked)
      .map(cb => cb.dataset.model);
  }

  // ── Search Logic ──
  function matchesTag(allTags, tag) {
    const regex = new RegExp(`\\b${tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
    return regex.test(allTags);
  }

  function applyFilters() {
    const must = dom.mustHave.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const mustNot = dom.mustNotHave.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const limit = parseInt(dom.resultCount.value);
    const models = getCheckedModels();

    let matching = [];
    for (const img of indexableImages) {
      const tg = getTaggroups(img, activePromptType);
      // Require image to have tags from every selected model
      if (models.length && !models.every(m => tg[m] && tg[m].trim() !== '')) continue;
      const allTags = models.map(m => tg[m] || '').join('; ').toLowerCase();
      if (must.length && !must.every(t => matchesTag(allTags, t))) continue;
      if (mustNot.some(t => matchesTag(allTags, t))) continue;
      matching.push(img);
    }

    currentResults = matching.slice(0, limit);
    dom.searchStats.textContent = `Showing ${currentResults.length} of ${matching.length} matches`;

    renderResults(models, must, mustNot);
  }

  function renderResults(models, must, mustNot) {
    dom.results.innerHTML = '';
    if (currentResults.length === 0) {
      dom.results.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>No results found. Try different tags or enable more models.</div>';
      return;
    }
    const fragment = document.createDocumentFragment();
    currentResults.forEach((img, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openLightbox(idx);

      const imgEl = document.createElement('img');
      imgEl.src = img.url;
      imgEl.alt = 'Result image';
      imgEl.loading = 'lazy';
      card.appendChild(imgEl);

      const overlay = document.createElement('div');
      overlay.className = 'card-overlay';
      const tg = getTaggroups(img, activePromptType);
      for (const model of models) {
        if (!tg[model]) continue;
        const groupTags = tg[model].toLowerCase();
        let isMatch = true;
        if (must.length && !must.every(t => matchesTag(groupTags, t))) isMatch = false;
        if (mustNot.some(t => matchesTag(groupTags, t))) isMatch = false;
        const badge = document.createElement('span');
        badge.className = 'model-badge ' + (isMatch ? 'match' : 'nomatch');
        badge.textContent = model;
        overlay.appendChild(badge);
      }
      card.appendChild(overlay);
      fragment.appendChild(card);
    });
    dom.results.appendChild(fragment);
  }

  // ── Lightbox ──
  function openLightbox(idx) {
    lightboxIndex = idx;
    updateLightbox();
    dom.lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    // Update URL hash for deep linking
    if (lightboxIndex >= 0 && lightboxIndex < currentResults.length) {
      history.replaceState(null, '', '#img=' + encodeURIComponent(currentResults[lightboxIndex].url));
    }
  }

  function closeLightbox() {
    dom.lightbox.classList.remove('open');
    document.body.style.overflow = '';
    lightboxIndex = -1;
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }

  function updateLightbox() {
    if (lightboxIndex < 0 || lightboxIndex >= currentResults.length) return;
    const img = currentResults[lightboxIndex];
    const models = getCheckedModels();

    dom.lbImgLink.href = img.url;
    dom.lbImg.src = img.url;
    dom.lbCounter.textContent = `${lightboxIndex + 1} / ${currentResults.length}`;

    // Show all prompt types in lightbox
    const tg = getTaggroups(img, activePromptType);
    const activeModels = models.filter(m => tg[m]);
    const totalModels = activeModels.length;

    function parseTags(str) {
      return str.split(/[;,\n]+/).map(t => t.trim()).filter(Boolean);
    }
    function normTag(t) { return t.toLowerCase().replace(/\s+/g, ' '); }

    const tagModelCount = {};
    for (const model of activeModels) {
      const tags = parseTags(tg[model]);
      const seen = new Set();
      for (const t of tags) {
        const key = normTag(t);
        if (!seen.has(key)) { seen.add(key); tagModelCount[key] = (tagModelCount[key] || 0) + 1; }
      }
    }

    function tagClass(count) {
      if (count >= totalModels) return 'tag-freq-all';
      if (count >= totalModels - 1 && totalModels >= 2) return 'tag-freq-almost';
      if (count === 1) return 'tag-freq-single';
      if (count === 2 && totalModels >= 4) return 'tag-freq-low';
      return 'tag-freq-neutral';
    }

    dom.lbTags.innerHTML = '';
    // Show current prompt type tags
    for (const model of activeModels) {
      const col = document.createElement('div');
      col.className = 'lb-tag-col';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'model-name';
      nameSpan.textContent = model;
      col.appendChild(nameSpan);
      const tags = parseTags(tg[model]);
      for (let i = 0; i < tags.length; i++) {
        const span = document.createElement('span');
        span.className = tagClass(tagModelCount[normTag(tags[i])]);
        span.textContent = tags[i];
        col.appendChild(span);
        if (i < tags.length - 1) col.appendChild(document.createTextNode('; '));
      }
      dom.lbTags.appendChild(col);
    }
    // Disable arrows at edges
    dom.lbPrev.style.visibility = lightboxIndex > 0 ? 'visible' : 'hidden';
    dom.lbNext.style.visibility = lightboxIndex < currentResults.length - 1 ? 'visible' : 'hidden';
  }

  function navigateLightbox(delta) {
    const newIdx = lightboxIndex + delta;
    if (newIdx < 0 || newIdx >= currentResults.length) return;
    lightboxIndex = newIdx;
    updateLightbox();
    // Update URL hash
    if (lightboxIndex >= 0 && lightboxIndex < currentResults.length) {
      history.replaceState(null, '', '#img=' + encodeURIComponent(currentResults[lightboxIndex].url));
    }
  }

  // ── Events ──
  dom.searchForm.addEventListener('submit', e => { e.preventDefault(); applyFilters(); });
  dom.lbClose.addEventListener('click', closeLightbox);
  dom.lbPrev.addEventListener('click', () => navigateLightbox(-1));
  dom.lbNext.addEventListener('click', () => navigateLightbox( 1));

  // Click backdrop to close
  dom.lightbox.addEventListener('click', e => {
    if (e.target === dom.lightbox) closeLightbox();
  });

  // Keyboard nav
  document.addEventListener('keydown', e => {
    if (!dom.lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft')  navigateLightbox(-1);
    if (e.key === 'ArrowRight') navigateLightbox( 1);
  });

  // ── Deep Link Handler ──
  function handleHashOnLoad() {
    const hash = window.location.hash;
    if (!hash.startsWith('#img=')) return;
    const targetUrl = decodeURIComponent(hash.substring(5));
    // First try to find in current results
    let idx = currentResults.findIndex(img => img.url === targetUrl);
    if (idx >= 0) {
      openLightbox(idx);
      return;
    }
    // If not in current results, find in all indexable images and add to results
    const img = indexableImages.find(img => img.url === targetUrl) || data.find(img => img.url === targetUrl);
    if (img) {
      currentResults.unshift(img);
      const models = getCheckedModels();
      const must = dom.mustHave.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const mustNot = dom.mustNotHave.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      renderResults(models, must, mustNot);
      openLightbox(0);
    }
  }
</script>
