<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elektroda AI Image Tag Search v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: #e0e0e8;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 28px 32px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7f5af0, #2cb5e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .header .subtitle {
      font-size: 0.82rem;
      color: #8888a4;
    }

    /* ── Search Panel ── */
    .search-panel {
      background: rgba(22, 22, 40, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 20px 32px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .search-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9999b5;
    }
    .field input[type="text"] {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px 14px;
      color: #e0e0e8;
      font-size: 0.9rem;
      font-family: inherit;
      width: 280px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input[type="text"]:focus {
      outline: none;
      border-color: #7f5af0;
      box-shadow: 0 0 0 3px rgba(127,90,240,0.15);
    }
    .field input[type="text"]::placeholder { color: #555570; }

    .btn-search {
      background: linear-gradient(135deg, #7f5af0, #6b3fd4);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-search:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(127,90,240,0.35);
    }
    .btn-search:active { transform: translateY(0); }

    .models-row {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      align-items: center;
    }
    .models-row .models-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9999b5;
      margin-right: 4px;
    }
    .model-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
    }
    .model-chip:hover { background: rgba(127,90,240,0.12); border-color: rgba(127,90,240,0.3); }
    .model-chip input[type="checkbox"] {
      accent-color: #7f5af0;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .stats-bar {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #7777a0;
    }

    /* ── Results Grid ── */
    .results-container { padding: 24px 32px 60px; }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
      border-color: rgba(127,90,240,0.25);
    }
    .card img {
      width: 100%;
      display: block;
      aspect-ratio: 4/3;
      object-fit: cover;
      transition: filter 0.3s;
    }
    .card:hover img { filter: brightness(1.08); }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      font-size: 0.68rem;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .card-overlay .model-badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }
    .card-overlay .model-badge.match { background: rgba(45,180,90,0.7); color: #d0ffd0; }
    .card-overlay .model-badge.nomatch { background: rgba(200,60,60,0.6); color: #ffc0c0; }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(8px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .lightbox.open { display: flex; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .lb-close {
      position: absolute;
      top: 16px; right: 24px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #ccc;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }
    .lb-close:hover { background: rgba(255,255,255,0.2); color: #fff; }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ccc;
      width: 48px; height: 48px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      z-index: 10;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .lb-nav:active { transform: translateY(-50%) scale(0.92); }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }

    .lb-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 85vw;
      max-height: 90vh;
      gap: 16px;
    }

    .lb-img-wrap {
      flex-shrink: 1;
      max-height: 72vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-img-wrap img {
      max-width: 80vw;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .lb-tags {
      width: 80vw;
      max-height: 16vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .lb-tags::-webkit-scrollbar { width: 6px; }
    .lb-tags::-webkit-scrollbar-track { background: transparent; }
    .lb-tags::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    .lb-tag-row {
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .lb-tag-row .model-name {
      font-weight: 700;
      color: #7f5af0;
      margin-right: 6px;
    }
    .lb-tag-row .tag-text { color: #bbbbd0; }

    .lb-counter {
      position: absolute;
      bottom: 14px;
      right: 24px;
      font-size: 0.75rem;
      color: #666;
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 10px;
      font-size: 0.9rem;
      color: #7777a0;
    }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid rgba(127,90,240,0.2);
      border-top-color: #7f5af0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #555570;
      font-size: 0.95rem;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Elektroda AI Image Tag Search</h1>
    <div class="subtitle" id="generalStats">Loading dataset…</div>
  </div>

  <form class="search-panel" id="searchForm" autocomplete="off">
    <div class="search-row">
      <div class="field">
        <label for="mustHave">Must Have Tags</label>
        <input type="text" id="mustHave" placeholder="e.g. camera security outdoor">
      </div>
      <div class="field">
        <label for="mustNotHave">Must Not Have Tags</label>
        <input type="text" id="mustNotHave" placeholder="e.g. microphone speaker">
      </div>
      <div class="field">
        <label for="resultCount">Max Results</label>
        <select id="resultCount" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:10px 14px; color:#e0e0e8; font-size:0.9rem; font-family:inherit;">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="250">250</option>
          <option value="500">500</option>
        </select>
      </div>
      <button type="submit" class="btn-search">Search</button>
    </div>
    <div class="models-row" id="modelsRow">
      <span class="models-label">Models:</span>
    </div>
    <div class="stats-bar" id="searchStats"></div>
  </form>

  <div class="results-container">
    <div id="loadingIndicator" class="loading">
      <div class="spinner"></div>
      <span>Loading work.json…</span>
    </div>
    <div class="image-grid" id="results"></div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose" title="Close (Esc)">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" title="Previous (←)">‹</button>
    <button class="lb-nav lb-next" id="lbNext" title="Next (→)">›</button>
    <div class="lb-content">
      <div class="lb-img-wrap">
        <img id="lbImg" src="" alt="">
      </div>
      <div class="lb-tags" id="lbTags"></div>
    </div>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

<script>
  // ── State ──
  let data = [];
  let allModels = new Set();
  let indexableImages = [];
  let modelUsageCount = {};
  let currentResults = [];
  let lightboxIndex = -1;

  // ── DOM refs ──
  const dom = {
    generalStats:     document.getElementById('generalStats'),
    modelsRow:        document.getElementById('modelsRow'),
    searchStats:      document.getElementById('searchStats'),
    results:          document.getElementById('results'),
    loadingIndicator: document.getElementById('loadingIndicator'),
    mustHave:         document.getElementById('mustHave'),
    mustNotHave:      document.getElementById('mustNotHave'),
    resultCount:      document.getElementById('resultCount'),
    searchForm:       document.getElementById('searchForm'),
    lightbox:         document.getElementById('lightbox'),
    lbImg:            document.getElementById('lbImg'),
    lbTags:           document.getElementById('lbTags'),
    lbCounter:        document.getElementById('lbCounter'),
    lbClose:          document.getElementById('lbClose'),
    lbPrev:           document.getElementById('lbPrev'),
    lbNext:           document.getElementById('lbNext'),
  };

  // ── Load Data ──
  fetch('work.json')
    .then(r => r.json())
    .then(json => {
      data = json.images || [];
      indexableImages = data.filter(img => img.taggroups && Object.keys(img.taggroups).length > 0);
      for (const img of indexableImages) {
        for (const model in img.taggroups) {
          allModels.add(model);
          modelUsageCount[model] = (modelUsageCount[model] || 0) + 1;
        }
      }
      renderModelCheckboxes();
      updateGeneralStats();
      dom.loadingIndicator.style.display = 'none';
      applyFilters();
    })
    .catch(err => {
      dom.loadingIndicator.innerHTML = `<span style="color:#ff5555">Failed to load work.json: ${err.message}</span>`;
    });

  // ── Model Checkboxes ──
  function renderModelCheckboxes() {
    const sorted = Array.from(allModels).sort();
    const fragment = document.createDocumentFragment();
    const label = document.createElement('span');
    label.className = 'models-label';
    label.textContent = 'Models:';
    fragment.appendChild(label);
    for (const model of sorted) {
      const chip = document.createElement('label');
      chip.className = 'model-chip';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.dataset.model = model;
      chip.appendChild(cb);
      chip.appendChild(document.createTextNode(model));
      fragment.appendChild(chip);
    }
    dom.modelsRow.innerHTML = '';
    dom.modelsRow.appendChild(fragment);
  }

  function updateGeneralStats() {
    const total = data.length;
    const indexable = indexableImages.length;
    const totalTags = indexableImages.reduce((s, img) => s + Object.keys(img.taggroups).length, 0);
    const modelInfo = Object.entries(modelUsageCount)
      .sort((a, b) => b[1] - a[1])
      .map(([m, c]) => `${m}: ${c}`)
      .join(' · ');
    dom.generalStats.textContent = `${total} images (${indexable} indexed) · ${totalTags} tag groups · ${modelInfo}`;
  }

  function getCheckedModels() {
    return Array.from(dom.modelsRow.querySelectorAll('input[type="checkbox"]'))
      .filter(cb => cb.checked)
      .map(cb => cb.dataset.model);
  }

  // ── Search Logic ──
  function matchesTag(allTags, tag) {
    const regex = new RegExp(`\\b${tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
    return regex.test(allTags);
  }

  function applyFilters() {
    const must = dom.mustHave.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const mustNot = dom.mustNotHave.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const limit = parseInt(dom.resultCount.value);
    const models = getCheckedModels();

    let matching = [];
    for (const img of indexableImages) {
      const allTags = models.map(m => img.taggroups[m] || '').join('; ').toLowerCase();
      if (must.length && !must.every(t => matchesTag(allTags, t))) continue;
      if (mustNot.some(t => matchesTag(allTags, t))) continue;
      matching.push(img);
    }

    currentResults = matching.slice(0, limit);
    dom.searchStats.textContent = `Showing ${currentResults.length} of ${matching.length} matches`;

    renderResults(models, must, mustNot);
  }

  function renderResults(models, must, mustNot) {
    dom.results.innerHTML = '';
    if (currentResults.length === 0) {
      dom.results.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>No results found. Try different tags or enable more models.</div>';
      return;
    }
    const fragment = document.createDocumentFragment();
    currentResults.forEach((img, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openLightbox(idx);

      const imgEl = document.createElement('img');
      imgEl.src = img.url;
      imgEl.alt = 'Result image';
      imgEl.loading = 'lazy';
      card.appendChild(imgEl);

      const overlay = document.createElement('div');
      overlay.className = 'card-overlay';
      for (const model of models) {
        const groupTags = (img.taggroups[model] || '').toLowerCase();
        let isMatch = true;
        if (must.length && !must.every(t => matchesTag(groupTags, t))) isMatch = false;
        if (mustNot.some(t => matchesTag(groupTags, t))) isMatch = false;
        const badge = document.createElement('span');
        badge.className = 'model-badge ' + (isMatch ? 'match' : 'nomatch');
        badge.textContent = model;
        overlay.appendChild(badge);
      }
      card.appendChild(overlay);
      fragment.appendChild(card);
    });
    dom.results.appendChild(fragment);
  }

  // ── Lightbox ──
  function openLightbox(idx) {
    lightboxIndex = idx;
    updateLightbox();
    dom.lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    dom.lightbox.classList.remove('open');
    document.body.style.overflow = '';
    lightboxIndex = -1;
  }

  function updateLightbox() {
    if (lightboxIndex < 0 || lightboxIndex >= currentResults.length) return;
    const img = currentResults[lightboxIndex];
    const models = getCheckedModels();

    dom.lbImg.src = img.url;
    dom.lbCounter.textContent = `${lightboxIndex + 1} / ${currentResults.length}`;

    // Build tag rows
    dom.lbTags.innerHTML = '';
    for (const model of models) {
      if (!img.taggroups[model]) continue;
      const row = document.createElement('div');
      row.className = 'lb-tag-row';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'model-name';
      nameSpan.textContent = model + ':';
      const tagSpan = document.createElement('span');
      tagSpan.className = 'tag-text';
      tagSpan.textContent = img.taggroups[model];
      row.appendChild(nameSpan);
      row.appendChild(tagSpan);
      dom.lbTags.appendChild(row);
    }

    // Disable arrows at edges
    dom.lbPrev.style.visibility = lightboxIndex > 0 ? 'visible' : 'hidden';
    dom.lbNext.style.visibility = lightboxIndex < currentResults.length - 1 ? 'visible' : 'hidden';
  }

  function navigateLightbox(delta) {
    const newIdx = lightboxIndex + delta;
    if (newIdx < 0 || newIdx >= currentResults.length) return;
    lightboxIndex = newIdx;
    updateLightbox();
  }

  // ── Events ──
  dom.searchForm.addEventListener('submit', e => { e.preventDefault(); applyFilters(); });
  dom.lbClose.addEventListener('click', closeLightbox);
  dom.lbPrev.addEventListener('click', () => navigateLightbox(-1));
  dom.lbNext.addEventListener('click', () => navigateLightbox( 1));

  // Click backdrop to close
  dom.lightbox.addEventListener('click', e => {
    if (e.target === dom.lightbox) closeLightbox();
  });

  // Keyboard nav
  document.addEventListener('keydown', e => {
    if (!dom.lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft')  navigateLightbox(-1);
    if (e.key === 'ArrowRight') navigateLightbox( 1);
  });
</script>

</body>
</html>
